<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Leaderboard</title>

  <link
    rel="stylesheet"
    href="highscore.css"
  >

  <link
    rel="stylesheet"
    href="app.css"
  >

</head>


<body>


  <main class="leaderboard-container">


 

    <section class="leaderboard-header">

      <div class="trophy">
        🏆
      </div>

      <h1>
        LEADERBOARD
      </h1>

      <p>
        Can you reach the top?
      </p>

      <div
        id="playerCount"
        class="player-count"
      >
        Loading players...
      </div>

    </section>




    <section class="score-card">


 

      <div
        id="loading"
        class="loading"
      >
        Loading scores...
      </div>



      <div
        id="emptyMessage"
        class="empty-message"
      >
        <div class="empty-icon">
          🎮
        </div>

        <h2>
          No Scores Yet
        </h2>

        <p>
          Be the first player to set a high score!
        </p>

      </div>




      <ul
        id="highScoreList"
        class="high-score-list"
      ></ul>


    </section>




    <div class="navigation">

      <a
        class="btn play-btn"
        href="game.html"
      >
        🎮 Play Again
      </a>

    </div>


  </main>


  <script
    type="module"
    src="highscore.js"
  ></script>


</body>

</html>
